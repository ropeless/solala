<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Solala sun mark</title>
  <desc id="desc">A golden sun with four pairs of diagonal rounded rays.</desc>

  <g fill="#FFB700">
    <!-- Sun -->
    <circle cx="256" cy="256" r="116"/>

    <!-- Four diagonal pairs of rounded rays -->
    <g transform="rotate(45 256 256)">
      <!-- Top pair -->
      <rect x="204" y="52" width="38" height="92" rx="19"/>
      <rect x="270" y="52" width="38" height="92" rx="19"/>

      <!-- Bottom pair -->
      <rect x="204" y="368" width="38" height="92" rx="19"/>
      <rect x="270" y="368" width="38" height="92" rx="19"/>

      <!-- Left pair -->
      <rect x="52" y="204" width="92" height="38" rx="19"/>
      <rect x="52" y="270" width="92" height="38" rx="19"/>

      <!-- Right pair -->
      <rect x="368" y="204" width="92" height="38" rx="19"/>
      <rect x="368" y="270" width="92" height="38" rx="19"/>
    </g>
  </g>
</svg>
